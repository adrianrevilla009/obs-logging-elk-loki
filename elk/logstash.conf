input {
  file {
    path => "/data/orders.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
  }
}
filter {
  date { match => ["ts", "ISO8601"] }
  mutate { remove_field => ["ts"] }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "orders-%{+YYYY.MM.dd}"
  }
}
