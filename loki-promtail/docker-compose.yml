services:
  loki:
    image: grafana/loki:3.2.1
    ports: ["3100:3100"]
  promtail:
    image: grafana/promtail:3.2.1
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - ./orders.log:/var/log/orders.log:ro
    depends_on: [loki]
